[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ergo"
version = "1.0.0"
description = "Cross-view disagreement in expert RULA/REBA posture-modifier annotation"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/hpicsk/ergo-modifiers"

[tool.setuptools]
packages = ["src", "src.phases", "src.preprocess", "src.andy"]

[tool.setuptools.dynamic]
# One source of truth for the pinned versions that produced the committed
# results: requirements.txt, which is also what a plain pip install
# reads.
dependencies = { file = ["requirements.txt"] }
